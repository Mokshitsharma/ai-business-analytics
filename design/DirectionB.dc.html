<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #16181c;
      color: #d7d9dd;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #5fb7a8; }
    a:hover { color: #7fcabd; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .box { background: #1e2126; border: 1px solid #2c3037; border-radius: 8px; }
    .ph { background: #2c3037; border-radius: 4px; }
  </style>
</helmet>

<div style="min-height: 900px; display: flex;">

  <!-- sidebar -->
  <nav style="width: 190px; flex-shrink: 0; border-right: 1px solid #2c3037; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 22px;">
      <div style="width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid #5fb7a8;"></div>
      <span class="mono" style="font-size: 12.5px; font-weight: 600; color: #eceef1;">analytics</span>
    </div>
    <div class="mono" style="font-size: 12px; padding: 8px 10px; border-radius: 6px; background: #262a30; color: #eceef1;">Workspace</div>
    <div class="mono" style="font-size: 12px; padding: 8px 10px; color: #8b8f97;">Datasets</div>
    <div class="mono" style="font-size: 12px; padding: 8px 10px; color: #8b8f97;">Models</div>
    <div class="mono" style="font-size: 12px; padding: 8px 10px; color: #8b8f97;">Reports</div>
    <div style="flex-grow: 1;"></div>
    <div class="mono" style="font-size: 11px; color: #6b6f77;">alternate direction &mdash; dense, dark, single-screen dashboard (no wizard)</div>
  </nav>

  <!-- main -->
  <div style="flex-grow: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div class="ph" style="width: 220px; height: 22px;"></div>
      <div style="display: flex; gap: 8px;">
        <div class="ph" style="width: 84px; height: 30px;"></div>
        <div class="ph" style="width: 110px; height: 30px; background: #34584f;"></div>
      </div>
    </div>

    <!-- upload + config strip -->
    <div class="box" style="padding: 16px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px;">
      <div style="border: 1px dashed #3a3f47; border-radius: 6px; padding: 18px; text-align: center;">
        <div class="ph" style="width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 10px;"></div>
        <div class="mono" style="font-size: 11.5px; color: #8b8f97;">drop dataset / browse</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; justify-content: center;">
        <div class="mono" style="font-size: 10.5px; color: #6b6f77;">TARGET</div>
        <div class="ph" style="height: 30px;"></div>
        <div class="mono" style="font-size: 10.5px; color: #6b6f77;">TASK</div>
        <div class="ph" style="height: 30px; width: 60%;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; justify-content: center;">
        <div class="ph" style="height: 14px; width: 90%;"></div>
        <div class="ph" style="height: 14px; width: 70%;"></div>
        <div class="ph" style="height: 14px; width: 80%;"></div>
        <div class="ph" style="height: 34px; background: #34584f; margin-top: 4px;"></div>
      </div>
    </div>

    <!-- metrics row -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">ACCURACY</div><div class="ph" style="height: 26px; width: 50%; margin-top: 8px;"></div></div>
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">F1</div><div class="ph" style="height: 26px; width: 50%; margin-top: 8px;"></div></div>
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">CV</div><div class="ph" style="height: 26px; width: 50%; margin-top: 8px;"></div></div>
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">ROWS</div><div class="ph" style="height: 26px; width: 60%; margin-top: 8px;"></div></div>
    </div>

    <!-- two-col: summary + importance -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex-grow: 1;">
      <div class="box" style="padding: 16px; display: flex; flex-direction: column; gap: 9px;">
        <div class="mono" style="font-size: 10px; color: #6b6f77;">EXECUTIVE SUMMARY</div>
        <div class="ph" style="height: 12px;"></div>
        <div class="ph" style="height: 12px;"></div>
        <div class="ph" style="height: 12px; width: 92%;"></div>
        <div class="ph" style="height: 12px; width: 78%;"></div>
        <div class="ph" style="height: 12px; width: 85%;"></div>
        <div style="height: 8px;"></div>
        <div class="ph" style="height: 12px; width: 60%;"></div>
        <div class="ph" style="height: 12px; width: 70%;"></div>
      </div>
      <div class="box" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div class="mono" style="font-size: 10px; color: #6b6f77;">SHAP FEATURE IMPORTANCE</div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="ph" style="width: 78px; height: 10px;"></div><div style="height: 10px; width: 100%; background: #5fb7a8; border-radius: 3px;"></div></div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="ph" style="width: 78px; height: 10px;"></div><div style="height: 10px; width: 72%; background: #5fb7a8; border-radius: 3px;"></div></div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="ph" style="width: 78px; height: 10px;"></div><div style="height: 10px; width: 55%; background: #4a8479; border-radius: 3px;"></div></div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="ph" style="width: 78px; height: 10px;"></div><div style="height: 10px; width: 38%; background: #4a8479; border-radius: 3px;"></div></div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="ph" style="width: 78px; height: 10px;"></div><div style="height: 10px; width: 24%; background: #3a5f58; border-radius: 3px;"></div></div>
      </div>
    </div>

    <!-- insights row -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">TRENDS</div><div class="ph" style="height: 10px; margin-top: 8px;"></div><div class="ph" style="height: 10px; width: 80%; margin-top: 6px;"></div></div>
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">ANOMALIES</div><div class="ph" style="height: 10px; margin-top: 8px;"></div><div class="ph" style="height: 10px; width: 80%; margin-top: 6px;"></div></div>
      <div class="box" style="padding: 14px;"><div class="mono" style="font-size: 10px; color: #6b6f77;">SEGMENTS</div><div class="ph" style="height: 10px; margin-top: 8px;"></div><div class="ph" style="height: 10px; width: 80%; margin-top: 6px;"></div></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
